<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashbox - CA's #1 Online Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            color: #ffffff; 
            overflow-x: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            background: #09090e;
            padding: 15px;
        }
        
        /* Dynamic Gaming Background */
        .animated-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
            background: linear-gradient(-45deg, #1f0b3b, #4a0e4e, #0a3d2c, #10204b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            opacity: 0.9;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* Floating Money/Game Orbs */
        .orb { position: fixed; border-radius: 50%; filter: blur(70px); z-index: -1; opacity: 0.5; animation: float 8s infinite ease-in-out alternate; }
        .orb-1 { width: 250px; height: 250px; background: #00ff88; top: 10%; left: -50px; }
        .orb-2 { width: 300px; height: 300px; background: #ff007f; bottom: 10%; right: -50px; animation-delay: -4s; }
        @keyframes float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-40px) scale(1.1); } }

        /* Main Glass Container */
        .glass-card {
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.95) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

        /* Top Badges */
        .top-badges { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .badge-rating { background: rgba(0,0,0,0.4); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; border: 1px solid rgba(255,215,0,0.3); }
        .badge-rating span { color: #ffdf00; letter-spacing: 1px; }
        .live-viewers { background: rgba(0, 255, 136, 0.15); border: 1px solid rgba(0, 255, 136, 0.4); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 8px; color: #e0ffe0; }
        .pulse-dot { width: 8px; height: 8px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 10px #00ff88; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* Typography */
        .brand { font-size: 1rem; color: #00ff88; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; display: block; }
        h1 { font-size: 2.4rem; font-weight: 900; line-height: 1.2; margin-bottom: 15px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        h1 span { background: linear-gradient(to right, #00ff88, #00b8ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Features Box */
        .features { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        .feature-item { font-size: 1rem; font-weight: 600; color: #e2e8f0; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .feature-item svg { width: 20px; height: 20px; fill: #00ff88; }

        /* Offer Details Highlight */
        .offer-highlight { background: linear-gradient(90deg, rgba(255, 0, 127, 0.1), rgba(0, 255, 136, 0.1)); border: 1px solid rgba(255,255,255,0.15); padding: 15px; border-radius: 12px; margin-bottom: 25px; display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px; }
        .offer-stat { text-align: center; }
        .offer-stat span { display: block; font-size: 0.8rem; color: #a0aec0; text-transform: uppercase; letter-spacing: 1px; }
        .offer-stat strong { font-size: 1.4rem; color: #fff; font-weight: 800; }

        /* Redirect & CTA */
        .redirect-wrapper { background: rgba(0, 0, 0, 0.3); border-radius: 16px; padding: 25px 20px; border: 1px solid rgba(255,255,255,0.05); }
        .status-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; color: #fff; }
        #timer-wrap { font-size: 1.5rem; font-weight: 800; color: #00ff88; margin-bottom: 15px; }
        
        .progress-wrap { width: 100%; background: rgba(255,255,255,0.1); border-radius: 10px; height: 8px; overflow: hidden; margin-bottom: 20px; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #00b8ff, #00ff88); animation: loadBar 5s linear forwards; }
        @keyframes loadBar { 100% { width: 100%; } }

        .btn { display: inline-block; width: 100%; background: linear-gradient(90deg, #00ff88, #00b8ff); color: #000; font-weight: 900; padding: 18px 20px; border-radius: 50px; text-decoration: none; font-size: 1.1rem; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 10px 20px rgba(0, 255, 136, 0.3); border: none; cursor: pointer; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(0, 255, 136, 0.5); filter: brightness(1.1); }

        /* Mobile Adjustments */
        @media (max-width: 480px) { 
            .glass-card { padding: 30px 20px; border-radius: 20px; }
            h1 { font-size: 1.9rem; }
            .top-badges { justify-content: center; }
            .offer-highlight { flex-direction: column; gap: 15px; }
        }

        /* Toasts */
        .toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: rgba(10, 15, 25, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(0, 255, 136, 0.3); padding: 12px 20px; border-radius: 50px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: bottom 0.5s ease; z-index: 100; width: max-content; max-width: 90vw; }
        .toast.show { bottom: 20px; }
        .toast-icon { background: rgba(0, 255, 136, 0.2); width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #00ff88; font-weight: bold; font-size: 1rem; }
        .toast-text { font-size: 0.85rem; color: #cbd5e1; }
        .toast-text span { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="animated-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-card">
        
        <div class="top-badges">
            <div class="badge-rating"><span>★★★★★</span> 4.9/5 (CA)</div>
            <div class="live-viewers"><div class="pulse-dot"></div> <span id="viewerCount">284</span> Playing Now</div>
        </div>

        <span class="brand">🔥 Cashbox Exclusive</span>
        <h1>Canada's #1<br><span>Online Game</span></h1>
        
        <div class="features">
            <div class="feature-item">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                Play and Earn Real Rewards
            </div>
            <div class="feature-item">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                Instant Deposit & Withdrawal
            </div>
            <div class="feature-item">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                100% Secure & Verified
            </div>
        </div>

        <div class="offer-highlight">
            <div class="offer-stat">
                <span>Min. Deposit</span>
                <strong>€15</strong>
            </div>
            <div class="offer-stat">
                <span>Win Up To</span>
                <strong>€200+</strong>
            </div>
        </div>

        <div class="redirect-wrapper">
            <div class="status-text" id="status-text">Entering game lobby automatically...</div>
            
            <div id="timer-wrap">00:0<span id="timer">5</span></div>
            
            <div class="progress-wrap" id="progress-wrap">
                <div class="progress-bar"></div>
            </div>
            
            <a href="YOUR_OFFER_LINK_HERE" class="btn" id="manualBtn">Play & Earn Now</a>
        </div>

    </div>

    <div class="toast" id="toast">
        <div class="toast-icon">✓</div>
        <div class="toast-text" id="toastMsg">
            <span>User from Toronto</span> just withdrew €150
        </div>
    </div>

    <script>
        // --- 1. SET YOUR CPA LINK HERE ---
        const OFFER_LINK = "https://go.gooddep.com/cashbox.ca/exn2fhxkq5"; 
        document.getElementById("manualBtn").href = OFFER_LINK;

        // --- 2. SMART AUTO-REDIRECT (FIRST TIME ONLY) ---
        const hasVisited = localStorage.getItem("visited_cashbox_ca");
        const statusText = document.getElementById("status-text");
        const timerWrap = document.getElementById("timer-wrap");
        const progressWrap = document.getElementById("progress-wrap");
        const timerElement = document.getElementById("timer");

        if (!hasVisited) {
            // First visit: Show timer & auto-redirect
            localStorage.setItem("visited_cashbox_ca", "true");
            let timeLeft = 5;
            
            const countdown = setInterval(() => {
                timeLeft--;
                timerElement.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    window.location.href = OFFER_LINK;
                }
            }, 1000);
        } else {
            // Return visit: Hide timer, show welcome back text
            statusText.innerText = "Welcome back! Ready to win?";
            timerWrap.style.display = "none";
            progressWrap.style.display = "none";
        }

        // --- 3. FAKE LIVE VIEWERS ---
        let viewers = 284;
        setInterval(() => {
            viewers += Math.floor(Math.random() * 7) - 3; 
            if(viewers < 250) viewers = 250; 
            document.getElementById("viewerCount").innerText = viewers;
        }, 3500);

        // --- 4. GAMING THEMED ROTATING TOASTS (CA CITIES) ---
        const cities = ["Toronto", "Vancouver", "Montreal", "Calgary", "Ottawa"];
        const actions = ["just deposited €20", "just withdrew €150", "won a €50 bonus", "joined the game"];
        const toast = document.getElementById("toast");
        const toastMsg = document.getElementById("toastMsg");
        
        function showToast() {
            const randomCity = cities[Math.floor(Math.random() * cities.length)];
            const randomAction = actions[Math.floor(Math.random() * actions.length)];
            
            toastMsg.innerHTML = `<span>Player from ${randomCity}</span> ${randomAction}`;
            toast.classList.add("show");
            
            setTimeout(() => {
                toast.classList.remove("show");
            }, 3500); 
        }

        setTimeout(() => {
            showToast();
            setInterval(showToast, 5000); // Shows a new toast every 5 seconds
        }, 1500);
    </script>

</body>
</html>
